name: Backfill historical Chart tags

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Precheck only, do not write tags; the automatic caller passes false'
        type: boolean
        default: true
        required: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Precheck only and print create/skip/conflict, do not write tags'
        type: boolean
        default: true
        required: true

jobs:
  backfill-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Precheck the fixed history mapping, then create missing tags
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          # Print the peeled commit SHA of a remote tag (annotated or
          # lightweight); empty output means the tag does not exist.
          remote_tag() {
            local ref="refs/tags/$1" refs
            if ! refs=$(git ls-remote origin "$ref" "$ref^{}"); then
              echo "failed to query remote tag: $1" >&2
              return 1
            fi
            awk -v ref="$ref" '
              $2 == ref { sha = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { if (peeled != "") print peeled; else if (sha != "") print sha }
            ' <<< "$refs"
          }

          # Fixed, manually audited version -> commit mapping. Do not infer
          # these from chart contents: history contains repacked artifacts and
          # side-branch commits that make inference ambiguous.
          tags=(v0.1.0 v0.2.0 v0.3.0 v0.4.0 v0.5.0 v0.6.0 v0.7.0)
          shas=(
            f5573ce7b8c47bfd28541e255ca20d4c8f15f758
            1f28a29ce0a286e89bf547a595bb36e25e02507c
            1079c02e41c8a53d58d446258ab6270ae0a99bc9
            7b962ef1f9bd2d5b996152fa340873142ed40227
            1ef1e4f1d4766c923bd9cf3df9392c85c6df9692
            55b6729492e4f03b541b42442edd845293c7d3c0
            40d7efd6971b9500f1c54f7b48fe7794724bde2e
          )
          pending=()

          # Phase 1: validate every entry before writing anything, so a bad
          # mapping or a conflicting tag never leaves a partial backfill.
          for i in "${!tags[@]}"; do
            tag=${tags[$i]}
            sha=${shas[$i]}
            if ! git cat-file -e "$sha^{commit}" ||
               ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
              echo "mapped commit missing or not on main: $tag $sha" >&2
              exit 1
            fi
            existing=$(remote_tag "$tag")
            if [[ -z "$existing" ]]; then
              echo "create $tag $sha"
              pending+=("$i")
            elif [[ "$existing" == "$sha" ]]; then
              echo "skip $tag $sha"
            else
              echo "conflict $tag: expected $sha, remote points to $existing; refusing to overwrite" >&2
              exit 1
            fi
          done

          if [[ "$DRY_RUN" == true ]]; then
            echo "dry-run: precheck complete, no tags written"
            exit 0
          fi

          # Phase 2: create only the missing tags, never force-push.
          for i in "${pending[@]}"; do
            tag=${tags[$i]}
            sha=${shas[$i]}
            if git push origin "$sha:refs/tags/$tag"; then
              echo "create $tag $sha"
            else
              # Push may fail because a concurrent run created the tag first.
              existing=$(remote_tag "$tag")
              if [[ "$existing" == "$sha" ]]; then
                echo "skip $tag $sha: created by a concurrent run"
              else
                echo "failed to create $tag: remote does not point to $sha; refusing to overwrite" >&2
                exit 1
              fi
            fi
          done